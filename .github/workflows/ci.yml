# CI (раздел 10.10). Каждый шаг ломает сборку при находках уровня high и выше.
# Экшены закреплены по commit SHA, образы сканеров — по digest (обновляет Renovate).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # В CI Postgres и Redis — сервис-контейнеры; встроенный Redis для локальных тестов не собираем.
  REDISMS_DISABLE_POSTINSTALL: '1'

jobs:
  lint:
    name: lint, typecheck, openapi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: node scripts/check-unicode.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - name: OpenAPI сгенерирован и закоммичен
        run: pnpm openapi:check

  test:
    name: unit + integration (Postgres, Redis)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: { POSTGRES_PASSWORD: ci-postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      TEST_PG_ADMIN_URL: postgresql://postgres:ci-postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Тесты и покрытие критичных модулей (≥ 90%)
        run: pnpm test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 14 }

  dependencies:
    name: dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: corepack enable
      - run: pnpm audit --audit-level high

  sast:
    name: semgrep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
          semgrep scan --error --metrics=off
          --config p/typescript --config p/react --config p/nodejsscan --config p/secrets --config .semgrep.yml
          --exclude node_modules --exclude dist --exclude generated --exclude docs/openapi

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --config .gitleaks.toml --redact --exit-code 1 --verbose

  images:
    name: docker images, trivy, compose smoke + e2e
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Сборка образов
        run: |
          for t in api jobs media admin tools; do
            docker build --target "$t" -t "idb-stories/$t:ci" .
          done
      - name: Trivy (HIGH, CRITICAL)
        run: |
          for t in api jobs media admin; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln,secret "idb-stories/$t:ci"
          done
          docker run --rm -v "$PWD:/src" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            config --severity HIGH,CRITICAL --exit-code 1 /src
      - name: docker compose up поднимает API и админку
        run: |
          docker compose up -d --build --wait --wait-timeout 300
          curl -fsS http://localhost:8080/v1/health
          curl -fsS -H 'X-Platform: web' 'http://localhost:8080/v1/feed?placement=home'
          curl -fsS http://localhost:8082/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8082/admin/v1/auth/me -o /dev/null -w '%{http_code}' | grep -q 401
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Playwright E2E против compose-стенда
        env:
          E2E_BASE_URL: http://localhost:8082
          E2E_PUBLIC_API: http://localhost:8080
        run: |
          corepack enable && pnpm install --frozen-lockfile
          pnpm --filter @idb-stories/admin exec playwright install --with-deps chromium
          pnpm e2e
      - name: Логи стенда при падении
        if: failure()
        run: docker compose logs --no-color | tail -500
