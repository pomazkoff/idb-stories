# CI (раздел 10.10). Каждый шаг ломает сборку при находках уровня high и выше.
# Экшены закреплены по commit SHA, образы сканеров — по digest (обновляет Renovate).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # В CI Postgres и Redis — сервис-контейнеры; встроенный Redis для локальных тестов не собираем.
  REDISMS_DISABLE_POSTINSTALL: '1'

jobs:
  lint:
    name: lint, typecheck, openapi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: node scripts/check-unicode.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - name: OpenAPI сгенерирован и закоммичен
        run: pnpm openapi:check

  test:
    name: unit + integration (Postgres, Redis)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: { POSTGRES_PASSWORD: ci-postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      TEST_PG_ADMIN_URL: postgresql://postgres:ci-postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Тесты и покрытие критичных модулей (≥ 90%)
        run: pnpm test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 14 }

  dependencies:
    name: dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - run: corepack enable
      - run: pnpm audit --audit-level high

  sast:
    name: semgrep
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: semgrep (любая находка ломает сборку)
        run: |
          set +e
          # --timeout 0: тяжёлые правила njsscan не пропускают большие файлы по тайм-ауту.
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            semgrep scan --error --metrics=off --timeout 0 --json-output=/src/.semgrep-report.json \
            --config p/typescript --config p/react --config p/nodejsscan --config p/secrets --config .semgrep.yml \
            --exclude node_modules --exclude dist --exclude generated --exclude docs/openapi
          rc=$?
          if [ "$rc" -ne 0 ] && [ -f .semgrep-report.json ]; then
            jq -r '.results[] | "\(.path):\(.start.line) \(.check_id)"' .semgrep-report.json \
              | node scripts/ci/annotate.mjs semgrep
          fi
          exit $rc

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: gitleaks (вся история)
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config .gitleaks.toml --redact --exit-code 1 --verbose \
            --report-format json --report-path /repo/.gitleaks-report.json
          rc=$?
          if [ "$rc" -ne 0 ] && [ -f .gitleaks-report.json ]; then
            jq -r '.[] | "\(.File):\(.StartLine) \(.RuleID) commit \(.Commit[0:7])"' .gitleaks-report.json \
              | node scripts/ci/annotate.mjs gitleaks
          fi
          exit $rc

  images:
    name: docker images, trivy, compose smoke + e2e
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Сборка образов
        run: |
          for t in api jobs media admin tools; do
            docker build --target "$t" -t "idb-stories/$t:ci" .
          done
      - name: Trivy (HIGH, CRITICAL)
        run: |
          # Сканируем все образы и конфигурацию, даже если один уже упал, — чтобы видеть все находки сразу.
          rc=0
          mkdir -p /tmp/trivy
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp/trivy:/out -v "$PWD:/src" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 "$@"
          }
          for t in api jobs media admin; do
            if ! trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln,secret \
                --format json --output "/out/$t.json" "idb-stories/$t:ci"; then
              rc=1
              jq -r '.Results[]? | .Target as $tg
                | (.Vulnerabilities[]? | "\(.PkgName) \(.InstalledVersion) → \(.FixedVersion) \(.VulnerabilityID) [\(.Severity)] in \($tg)"),
                  (.Secrets[]? | "secret \(.RuleID) in \($tg)")' "/tmp/trivy/$t.json" \
                | node scripts/ci/annotate.mjs "trivy image $t"
            fi
          done
          if ! trivy config --severity HIGH,CRITICAL --exit-code 1 --format json --output /out/config.json /src; then
            rc=1
            jq -r '.Results[]? | .Target as $tg | .Misconfigurations[]?
              | "\($tg): \(.ID) \(.Title) [\(.Severity)]"' /tmp/trivy/config.json \
              | node scripts/ci/annotate.mjs "trivy config"
          fi
          exit $rc
      - name: docker compose up поднимает API и админку
        run: |
          docker compose up -d --build --wait --wait-timeout 300
          curl -fsS http://localhost:8080/v1/health
          curl -fsS -H 'X-Platform: web' 'http://localhost:8080/v1/feed?placement=home'
          curl -fsS http://localhost:8082/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/admin/v1/auth/me)" = 401
      - name: Playwright E2E против compose-стенда
        env:
          E2E_BASE_URL: http://localhost:8082
          E2E_PUBLIC_API: http://localhost:8080
        run: |
          corepack enable && pnpm install --frozen-lockfile
          pnpm --filter @idb-stories/admin exec playwright install --with-deps chromium
          pnpm e2e
      - name: Состояние стенда при падении
        if: failure()
        run: |
          docker compose ps -a --format '{{.Name}}: {{.State}} {{.Status}}' | node scripts/ci/annotate.mjs 'compose ps'
          for svc in $(docker compose ps -a --format '{{.Service}}'); do
            docker compose logs --no-color --tail 25 "$svc" 2>&1 | tail -25 \
              | ANNOTATE_LEVEL=warning node scripts/ci/annotate.mjs "logs $svc" || true
          done
          docker compose logs --no-color | tail -500
